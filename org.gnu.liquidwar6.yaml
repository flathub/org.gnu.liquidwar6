app-id: org.gnu.liquidwar6
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: liquidwar6
rename-icon: liquidwar6
rename-desktop-file: liquidwar6.desktop
finish-args:
  - --socket=pulseaudio
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --persist=.liquidwar6
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/aclocal
  - /share/cmake
  - /share/doc
  - /share/info
  - /share/man
  - /share/pixmaps
  - /share/samples
  - '*.la'
  - '*.a'
modules:
  - shared-modules/SDL/sdl12-compat.json
  - shared-modules/SDL/SDL_image-1.2.12.json
  - shared-modules/SDL/SDL_mixer-1.2.12.json
  - shared-modules/SDL/SDL_ttf-2.0.11.json

  - name: gc
    buildsystem: autotools
    config-opts:
      - --disable-docs
    sources:
      - type: archive
        url: http://www.hboehm.info/gc/gc_source/gc-8.0.4.tar.gz
        sha256: 436a0ddc67b1ac0b0405b61a9675bca9e075c8156f4debd1d06f3a56c7cd289d

  - name: libunistring
    buildsystem: autotools
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/libunistring/libunistring-0.9.10.tar.xz
        sha256: eb8fb2c3e4b6e2d336608377050892b54c3c983b646c561836550863003c05d7

  - name: guile
    buildsystem: autotools
    config-opts:
      - --disable-error-on-warning
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/guile/guile-2.2.4.tar.xz
        sha256: d9e8b94af7b206fcf52bec6501b921bd7d0bd7a31fb7e896a35ba8253678e31e
      - type: patch
        path: guile-never-recompile.patch

  - name: libcaca
    config-opts:
      - --disable-doc
      - --disable-python
      - --disable-ruby
      - --disable-static
    sources:
      - type: archive
        url: http://security.debian.org/debian-security/pool/updates/main/libc/libcaca/libcaca_0.99.beta19.orig.tar.gz
        sha256: 128b467c4ed03264c187405172a4e83049342cc8cc2f655f53a2d0ee9d3772f4

  - name: csound
    buildsystem: cmake-ninja
    build-options:
      cxxflags: -Wno-error=template-body
      env:
        PYTHONHOME: /app
        PYTHONPATH: /usr/lib/python3.13
    sources:
      - type: archive
        url: https://github.com/csound/csound/archive/refs/tags/6.18.1.tar.gz
        sha256: b84be8237fa9258ef60fdddf36fae27b20c11665811bf5ed12540da9a9a4414e

  - name: liquidwar6
    buildsystem: autotools
    config-opts:
      - --enable-allinone
      - --disable-static
      - --disable-rpath
    build-options:
      cflags: -Wno-error=deprecated-declarations -Wno-error=address -Wno-error=use-after-free -std=gnu17
    post-install:
      - install -Dm644 /app/share/pixmaps/liquidwar6.png -t /app/share/icons/hicolor/128x128/apps/
      - install -Dm644 org.gnu.liquidwar6.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: archive
        url: http://ftp.gnu.org/gnu/liquidwar6/liquidwar6-0.6.3902.tar.gz
        sha256: d605549afae403439524e572322e45ebf5b6db8ea59505e5d51cb581a8b5e6a4
      - type: patch
        paths:
          - liquidwar-drop-Werror.patch
          - liquidwar-guile22.patch
      - type: shell
        commands:
          - autoreconf -ivf
      - type: file
        path: org.gnu.liquidwar6.metainfo.xml

  - name: liquidwar6-extra-maps
    buildsystem: autotools
    sources:
      - type: archive
        url: https://download-mirror.savannah.gnu.org/releases/liquidwar6/0.6.3902/liquidwar6-extra-maps-0.6.3902.tar.gz
        sha256: c9a6c6f05b8898057a5784e2734fda5c39e3e7c40ecbb29c690459d6338509f0
